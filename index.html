<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7">
<title>Arbetstid</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;color:#111;background:#f5f5f7}
*{box-sizing:border-box}body{margin:0;background:#f5f5f7}main{max-width:620px;margin:auto;padding:22px 14px 44px}
h1{font-size:29px;letter-spacing:-.7px;margin:3px 0 18px}h2{font-size:19px;margin:0 0 12px}
.card{background:#fff;border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 1px 3px #0001}
.hero{text-align:center;padding:24px 18px}.big{font-size:48px;font-weight:750;letter-spacing:-2px}.muted{color:#777}.small{font-size:13px}
select,input{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;background:#fff;font-size:17px}
label{display:block;font-size:13px;color:#666;margin:12px 0 5px}
.field{background:#f7f7f8;border-radius:16px;padding:13px;margin:10px 0}.field label{margin:0 0 5px}
.result{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-top:1px solid #eee;margin-top:14px}
.diff{font-size:26px;font-weight:750}.pos{color:#16803c}.neg{color:#b42318}
button{border:0;border-radius:14px;background:#111;color:#fff;padding:13px 16px;font-size:16px;font-weight:650;width:100%;margin-top:10px}
.secondary{background:#eee;color:#111}.danger{background:#fff;color:#b42318;border:1px solid #eee}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f7f7f8;border-radius:16px;padding:14px}.metric b{font-size:20px}
.list{margin-top:8px}.monthrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#e8f7ed;color:#16803c;font-weight:650}
.withdraw{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#fff;width:100%;max-width:620px;border-radius:24px 24px 0 0;padding:20px 18px 28px}
@media(min-width:650px){.modal{align-items:center}.sheet{border-radius:24px}}
</style>
</head>
<body>
<main>
<h1>ARBETSTID</h1>

<section class="card hero">
  <div class="muted">AKTUELLT KOMPSALDO</div>
  <div class="big" id="balance">40:27</div>
  <div class="muted">Tillgänglig komp</div>
</section>

<section class="card">
  <h2>Månad</h2>
  <select id="monthSelect">
<option value="0">Januari</option>
<option value="1">Februari</option>
<option value="2">Mars</option>
<option value="3">April</option>
<option value="4">Maj</option>
<option value="5">Juni</option>
<option value="6">Juli</option>
<option value="7">Augusti</option>
<option value="8">September</option>
<option value="9">Oktober</option>
<option value="10">November</option>
<option value="11">December</option>
</select>

  <div class="field">
    <label>Arbetsvecka tid</label>
    <input id="planned" inputmode="numeric" placeholder="t.ex. 144:00">
  </div>

  <div class="field">
    <label>Arbetade timmar</label>
    <input id="worked" inputmode="numeric" placeholder="t.ex. 148:36">
  </div>

  <div class="result">
    <div>
      <div class="muted small">Månadens diff</div>
      <div class="muted small">Diffen läggs automatiskt till kompsaldot</div>
    </div>
    <div class="diff" id="diff">0:00</div>
  </div>

  <button onclick="saveMonth()">Spara månad</button>
</section>

<section class="card">
  <h2>Årets översikt</h2>
  <div class="grid">
    <div class="metric"><div class="muted small">Intjänad komp</div><b id="earned">0:00</b></div>
    <div class="metric"><div class="muted small">Uttagen komp</div><b id="used">0:00</b></div>
  </div>
  <div class="list" id="summary"></div>
</section>

<section class="card">
  <h2>Ta ut komp</h2>
  <div class="metric"><div class="muted small">Tillgängligt just nu</div><b id="available">40:27</b></div>
  <button onclick="openTake()">➖ Ta ut komp</button>
</section>

<section class="card">
  <h2>Komputtag</h2>
  <div id="withdrawals"></div>
</section>

<section class="card">
  <h2>Startsaldo</h2>
  <label>Kompsaldo vid årets början</label>
  <input id="opening" value="40:27" inputmode="numeric">
  <button class="secondary" onclick="saveOpening()">Spara startsaldo</button>
</section>

<section class="card">
  <h2>Data</h2>
  <div class="muted small">Allt sparas lokalt på enheten.</div>
  <button class="secondary" onclick="exportData()">Exportera säkerhetskopia</button>
  <button class="secondary" onclick="document.getElementById('file').click()">Importera säkerhetskopia</button>
  <button class="danger" onclick="resetData()">Radera all data</button>
  <input id="file" type="file" accept=".json" style="display:none">
</section>
</main>

<div class="modal" id="modal">
<div class="sheet">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2 style="margin:0">Ta ut komp</h2>
    <button style="width:auto;background:#eee;color:#111;margin:0" onclick="closeTake()">Stäng</button>
  </div>
  <label>Antal timmar</label>
  <input id="takeHours" inputmode="numeric" placeholder="t.ex. 8:00">
  <label>Datum</label>
  <input id="takeDate" type="date">
  <label>Kommentar</label>
  <input id="takeNote" placeholder="t.ex. ledig eftermiddag">
  <button onclick="addWithdrawal()">Registrera uttag</button>
</div>
</div>

<script>
const KEY="arbetstid_tracker_v3";
const months=["Januari","Februari","Mars","April","Maj","Juni","Juli","Augusti","September","Oktober","November","December"];
const initial=[
["144:00","148:36"],["144:00","149:17"],["144:00","150:46"],["144:00","151:15"],
["136:00","138:27"],["112:00","116:00"],["40:00","38:00"],["168:00","173:29"],
["24:00","24:00"],["24:00","24:00"],["24:00","24:00"],["24:00","24:00"]
];
function fresh(){return {opening:"40:27",months:initial.map(x=>({planned:x[0],worked:x[1],saved:true})),withdrawals:[]}}
let db;
try{db=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){db=null}
if(!db||!db.months)db=fresh();

function mins(s){
 if(!s)return 0;
 let neg=String(s).trim().startsWith("-");
 let p=String(s).replace("-","").split(":");
 let m=(parseInt(p[0])||0)*60+(parseInt(p[1])||0);
 return neg?-m:m;
}
function hm(m){
 let sign=m<0?"−":"";
 m=Math.abs(Math.round(m));
 return sign+Math.floor(m/60)+":"+String(m%60).padStart(2,"0");
}
function totals(){
 let earned=0;
 db.months.forEach(m=>earned+=mins(m.worked)-mins(m.planned));
 let used=db.withdrawals.reduce((a,w)=>a+mins(w.hours),0);
 return {earned,used,balance:mins(db.opening)+earned-used};
}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function setupSelect(){
 const s=document.getElementById("monthSelect");
 s.addEventListener("change",loadMonth);
}
function loadMonth(){
 let i=+document.getElementById("monthSelect").value, m=db.months[i];
 document.getElementById("planned").value=m.planned||"";
 document.getElementById("worked").value=m.worked||"";
 updateDiff();
}
function updateDiff(){
 let d=mins(document.getElementById("worked").value)-mins(document.getElementById("planned").value);
 let el=document.getElementById("diff");
 el.textContent=hm(d);el.className="diff "+(d>0?"pos":d<0?"neg":"");
}
document.getElementById("planned").addEventListener("input",updateDiff);
document.getElementById("worked").addEventListener("input",updateDiff);

function saveMonth(){
 let i=+document.getElementById("monthSelect").value;
 db.months[i].planned=document.getElementById("planned").value||"0:00";
 db.months[i].worked=document.getElementById("worked").value||"0:00";
 db.months[i].saved=true;
 save();render();
}
function render(){
 let t=totals();
 document.getElementById("balance").textContent=hm(t.balance);
 document.getElementById("available").textContent=hm(t.balance);
 document.getElementById("earned").textContent=hm(t.earned);
 document.getElementById("used").textContent=hm(t.used);
 document.getElementById("opening").value=db.opening;
 let summary=document.getElementById("summary");
 summary.innerHTML=months.map((name,i)=>{
   let m=db.months[i],d=mins(m.worked)-mins(m.planned);
   return `<div class="monthrow"><div><strong>${name}</strong><div class="muted small">${m.planned||"0:00"} planerat · ${m.worked||"0:00"} arbetat</div></div><strong class="${d>0?"pos":d<0?"neg":""}">${hm(d)}</strong></div>`;
 }).join("");
 renderWithdrawals();
 loadMonth();
}
function openTake(){
 document.getElementById("takeHours").value="";
 document.getElementById("takeDate").value=new Date().toISOString().slice(0,10);
 document.getElementById("takeNote").value="";
 document.getElementById("modal").style.display="flex";
}
function closeTake(){document.getElementById("modal").style.display="none"}
function addWithdrawal(){
 let h=document.getElementById("takeHours").value.trim(),n=mins(h),bal=totals().balance;
 if(n<=0)return alert("Ange ett giltigt antal timmar.");
 if(n>bal)return alert("Du har inte så mycket komp tillgängligt.");
 db.withdrawals.push({hours:h,date:document.getElementById("takeDate").value,note:document.getElementById("takeNote").value.trim()});
 save();closeTake();render();
}
function renderWithdrawals(){
 let el=document.getElementById("withdrawals");
 if(!db.withdrawals.length){el.innerHTML='<div class="muted small">Inga komputtag registrerade.</div>';return}
 el.innerHTML=db.withdrawals.slice().reverse().map((w,ri)=>{
   let i=db.withdrawals.length-1-ri;
   return `<div class="withdraw"><div><strong>${w.hours}</strong> <span class="muted">${w.date||""}</span><div class="muted small">${w.note||""}</div></div><button class="danger" style="width:auto;margin:0;padding:8px 10px" onclick="removeWithdrawal(${i})">Ta bort</button></div>`;
 }).join("");
}
function removeWithdrawal(i){if(confirm("Ta bort komputtaget?")){db.withdrawals.splice(i,1);save();render()}}
function saveOpening(){db.opening=document.getElementById("opening").value||"0:00";save();render()}
function exportData(){
 save();
 let b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(b);a.download="arbetstid-backup.json";a.click();URL.revokeObjectURL(a.href);
}
document.getElementById("file").addEventListener("change",e=>{
 let f=e.target.files[0];if(!f)return;
 let r=new FileReader();
 r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.months||!x.withdrawals)throw 0;db=x;save();render();alert("Import klar.")}catch(_){alert("Kunde inte importera filen.")}};
 r.readAsText(f);
});
function resetData(){if(confirm("Radera all arbetstid och alla komputtag?")){db=fresh();save();render()}}
setupSelect();render();
</script>
</body>
</html>
